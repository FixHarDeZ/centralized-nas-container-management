name: Update and Deploy Architecture Map

on:
  push:
    branches:
      - main # เปลี่ยนเป็นชื่อ branch หลักของคุณ เช่น master หรือ main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user repository
        uses: actions/checkout@v4
        with:
          path: 'repo-data'

      - name: Checkout Archify Engine
        uses: actions/checkout@v4
        with:
          repository: 'tt-a1i/archify'
          path: 'archify'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect & Install Archify
        run: |
          cd archify
          ls -la
          # ติดตั้ง dependencies หากมี pyproject.toml, setup.py หรือ requirements.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f setup.py ] || [ -f pyproject.toml ]; then pip install .; fi

      - name: Generate Architecture Map
        run: |
          mkdir -p dist
          # รัน generator เพื่อ scan โฟลเดอร์ repo-data ออกมาไว้ที่ dist
          # ตัวอย่าง: archify --input ./repo-data --output ./dist
          # หรือ: python -m archify ./repo-data -o ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4