name: Update and Deploy Architecture Map

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user repository
        uses: actions/checkout@v4
        with:
          path: 'repo-data'

      - name: Checkout Archify Engine
        uses: actions/checkout@v4
        with:
          repository: 'tt-a1i/archify'
          path: 'archify'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build
        run: |
          cd archify
          npm ci
          # แปลง data หรือ copy โครงสร้างจาก ../repo-data เข้ามาประมวลผล
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './archify/dist' # หรือ ./archify/build ตาม output directory ของ archify

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4