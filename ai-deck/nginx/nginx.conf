# ai-deck edge: static UI + websocket to ttyd + read-only file listing.
# Everything is behind basic auth — a shell with permission prompts off sits
# on the other side of this file.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# One desk per person: each basic auth user gets their own ttyd (and so its
# own tmux session), because --max-clients is per instance and a shared
# session is one keyboard. The roster is DESK_USERS in docker-compose.yml;
# this map is its second copy and tests/test_desks.py fails if they drift.
# Anyone not listed lands on the default desk.
map $remote_user $desk_port {
    default   7681;
    Pookzii   7684;
}

server {
    listen 80;

    # A variable in proxy_pass makes nginx resolve the name at request time
    # rather than at start-up, so it needs docker's own resolver. Without
    # this, every /ws is a 502 with "no resolver defined".
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;

    auth_basic           "ai-deck";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Readiness only: no account, filesystem, quota or credential data.
    location = /health {
        auth_basic off;
        proxy_pass http://ai-deck:7683/chat/health;
        add_header Cache-Control "no-store";
    }

    # Our own page instead of ttyd's — ttyd only ever sees /ws and /token.
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
    }
    # Third-party libraries and fonts are pinned files that never change
    # without a new image — a week of caching costs nothing.
    location ~* ^/(vendor|fonts)/ {
        root  /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800";
    }
    # Our own page, however, does change, and this desk is installed to a home
    # screen as a PWA: a week-long cache meant a UI fix silently did not reach
    # the phone until the browser felt like refetching. Revalidate every load;
    # the 304 is one round trip on a file of a few tens of KB.
    location ~* \.(js|css|svg|png|webmanifest)$ {
        root  /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /token {
        proxy_pass http://ai-deck:$desk_port/token;
    }

    location = /ws {
        proxy_pass          http://ai-deck:$desk_port/ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_set_header    Host       $http_host;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
    }

    # The share, read-only: /files/in/ and /files/out/ list as JSON for the
    # drawer and serve the file itself when a name is tapped (iOS previews
    # pptx/xlsx inline, so no attachment header). The share root itself is
    # not listed — it would show #recycle and @eaDir.
    location = /files/ { return 404; }
    location /files/ { return 404; }
    location ^~ /files/in/ {
        alias /files/in/;
        disable_symlinks on;
        autoindex           on;
        autoindex_format    json;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-store";
    }
    location ^~ /files/out/ {
        alias /files/out/;
        disable_symlinks on;
        autoindex           on;
        autoindex_format    json;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-store";
    }


    # Desk side of the same process: rate-limit numbers for the header and
    # the session list behind the history button. Its own block because
    # /upload/ is a prefix match and would never catch these; basic auth is
    # declared on the server, so it applies here without repeating it.
    location /api/ {
        proxy_pass          http://ai-deck:7682;
        proxy_http_version  1.1;
        # Which desk the sessions sheet drives. Set here, so a browser that
        # sends its own X-Desk-User cannot aim the Quit button at the other
        # person's session.
        proxy_set_header    X-Desk-User $remote_user;
        add_header Cache-Control "no-store";
    }

    # Chat view. /chat/events is server-sent events, so buffering has to be
    # off (nginx would otherwise hold the whole turn and the page would show
    # nothing until it ended — indistinguishable from a hung agent) and the
    # read timeout has to be long, because a stream that only carries a
    # heartbeat every 20s looks idle to the default 60s.
    location /chat/ {
        proxy_pass          http://ai-deck:7683;
        proxy_http_version  1.1;
        # chat.py keeps a separate agent per authenticated user/provider. This
        # identifies the caller, and
        # setting it here means the browser cannot claim to be someone else.
        proxy_set_header    X-Desk-User $remote_user;
        proxy_set_header    Connection "";
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        add_header Cache-Control "no-store";
    }

    # Optional worker: variables defer DNS so document mode still boots without it.
    location /code/chat/ {
        set $coding_chat ai-deck-code:7683;
        rewrite ^/code/(.*)$ /$1 break;
        proxy_pass http://$coding_chat;
        proxy_set_header X-Desk-User $remote_user;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 86400s;
        add_header Cache-Control "no-store";
    }
    location /code/projects {
        set $coding_chat ai-deck-code:7683;
        rewrite ^/code/(.*)$ /$1 break;
        proxy_pass http://$coding_chat;
        proxy_set_header X-Desk-User $remote_user;
        proxy_read_timeout 180s;
        add_header Cache-Control "no-store";
    }
    location /code/api/ {
        set $coding_api ai-deck-code:7682;
        rewrite ^/code/(.*)$ /$1 break;
        proxy_pass http://$coding_api;
        proxy_set_header X-Desk-User $remote_user;
        add_header Cache-Control "no-store";
    }
    location = /code/token {
        proxy_pass http://ai-deck-code:$desk_port/token;
    }
    location = /code/ws {
        proxy_pass http://ai-deck-code:$desk_port/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
    location /deploy/ {
        proxy_pass http://ai-deck:7683;
        proxy_set_header X-Desk-User $remote_user;
        add_header Cache-Control "no-store";
    }

    # Upload side: the desk container's upload.py writes PUT bodies into
    # /work/in. Size cap lives here; DSM's reverse proxy has its own.
    location /upload/ {
        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_pass          http://ai-deck:7682;
        proxy_http_version  1.1;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }
}
