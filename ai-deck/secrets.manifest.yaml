env:
  AI_DECK_DEPLOY_TOKEN: stacks.ai_desk.deploy_runner.token
  AI_DECK_DEPLOY_URL: stacks.ai_desk.deploy_runner.url
  AI_DECK_DEPLOY_CA_B64: stacks.ai_desk.deploy_runner.ca_b64
  # `claude setup-token` on a machine with a browser → paste into the vault.
  # Subscription token, ~1 year; a Console API key would bill per token.
  CLAUDE_CODE_OAUTH_TOKEN:       stacks.ai_desk.oauth_token
  DASHBOARD_BASIC_AUTH_USER:     stacks.ai_desk.dashboard.basic_auth_user
  DASHBOARD_BASIC_AUTH_PASSWORD: stacks.ai_desk.dashboard.basic_auth_password
  # `mimo <ask>` in the desk: the same key the bots use, no vault edit.
  MIMO_API_KEY:                  shared.llm.mimo_api_key

literals:
  AI_DECK_DEPLOY_SOCKET: /work/.runner/runner.sock
  # DSM shared folder (create it in Control Panel first — synoshare --add
  # refuses). Mounted at /work in the desk and /files (out/ only) in nginx.
  CLAUDE_WORK_DIR: /volume2/ai-work
  MIMO_BASE_URL: https://token-plan-sgp.xiaomimimo.com/v1
  MIMO_MODEL: mimo-v2.5-pro
