<!doctype html><meta charset="utf-8"><title>Coding workspace checks</title>
<pre id="result">pending</pre>
<script>
const failures = [];
const check = (ok, message) => { if (!ok) failures.push(message); };
const pause = () => new Promise(resolve => setTimeout(resolve, 150));
(async () => {
  try {
    const frame = document.createElement('iframe');
    frame.style = 'width:390px;height:844px';
    const id = 'a'.repeat(32);
    await new Promise(resolve => {
      frame.onload = () => setTimeout(resolve, 100);
      frame.src = '../ui/?demo=1&chat=1&welcome=1&coding=1&workspace=' + id;
      document.body.append(frame);
    });
    const win = frame.contentWindow, doc = frame.contentDocument;
    const calls = [];
    win.fetch = async (path, options = {}) => {
      calls.push({path, options});
      const data = path === 'deploy/profiles' ? {items:[{id:'nas-ai-deck'}]}
        : path === 'deploy/jobs' ? {id:'b'.repeat(32), status:'queued'}
        : path.startsWith('deploy/jobs/') ? {status:'succeeded',log:'Health check passed'}
        : {branch:'desk/' + id,head:'c'.repeat(40),changes:'M app.py',diff:'diff --git a/app.py b/app.py\n+hello'};
      return {ok:true, json:async () => data};
    };
    check(win.DeskWorkspace.url('chat/events?after=0') === 'code/chat/events?after=0&workspace=' + id, 'SSE URL includes workspace');
    check(doc.getElementById('files-btn').hidden, 'document files hidden in coding mode');
    doc.getElementById('project-manage').click();
    await pause();
    const dialog = doc.getElementById('project-dialog');
    check(dialog.open, 'project dialog opens');
    check(!doc.getElementById('project-details').hidden, 'current task controls visible');
    const rect = dialog.getBoundingClientRect();
    check(rect.left >= 0 && rect.right <= 390, 'project dialog fits phone');
    check(Math.abs(rect.left - (390 - rect.width) / 2) < 2, 'project dialog is centered on phone');
    check(doc.getElementById('deploy-pane').hidden, 'deployment form is separate from project form');
    check(!doc.getElementById('project-connect').open, 'new repository form is collapsed for existing task');
    doc.getElementById('project-refresh').click(); await pause();
    check(doc.getElementById('project-diff').textContent.includes('+hello'), 'diff displayed literally');
    check(doc.getElementById('deploy-sha').value === 'c'.repeat(40), 'deploy uses explicit full SHA');
    const input = doc.getElementById('chat-input');
    input.value = 'Existing draft';
    doc.querySelector('[data-code-prompt]').click();
    check(input.value === 'Existing draft', 'task shortcut preserves existing draft');
    input.value = '';
    doc.querySelector('[data-code-prompt]').click();
    check(input.value.includes('appropriate tests'), 'test shortcut fills composer');
    check(!calls.some(c => c.path.includes('chat/send')), 'shortcuts never auto-send');
    doc.getElementById('project-manage').click(); await pause();
    doc.getElementById('deploy-tab').click();
    check(doc.getElementById('project-pane').hidden && !doc.getElementById('deploy-pane').hidden, 'deploy tab shows only deployment controls');
    doc.getElementById('deploy-tab').dispatchEvent(new win.KeyboardEvent('keydown', {key:'ArrowLeft', bubbles:true}));
    check(doc.activeElement === doc.getElementById('project-tab'), 'tabs support keyboard navigation');
    doc.getElementById('deploy-tab').click();
    doc.getElementById('deploy-profile').value = 'nas-ai-deck';
    doc.getElementById('deploy-form').requestSubmit(); await pause();
    const call = calls.find(c => c.path === 'deploy/jobs');
    check(call && JSON.parse(call.options.body).sha === 'c'.repeat(40), 'deployment sends selected full SHA');
    check(doc.getElementById('deploy-message').textContent.includes('succeeded'), 'deployment reports runner result');
    doc.getElementById('project-close').click();
    check(!dialog.open, 'project dialog closes');
    frame.style.width = '1280px';
    await pause();
    doc.getElementById('project-manage').click(); await pause();
    const desktop = dialog.getBoundingClientRect();
    check(desktop.width <= 600 && Math.abs(desktop.left - (1280 - desktop.width) / 2) < 2, 'desktop dialog is compact and centered');
    check(doc.querySelector('.project-bar').getBoundingClientRect().height <= 56, 'project toolbar stays compact');
    doc.getElementById('project-close').click();
    win.fetch = async () => ({ok:true, json:async () => ({items:[]})});
    doc.getElementById('project-manage').click(); await pause();
    doc.getElementById('deploy-tab').click();
    check(doc.getElementById('deploy-submit').disabled, 'deploy unavailable when account has no profiles');
  } catch (error) { failures.push(String(error)); }
  document.getElementById('result').textContent = JSON.stringify({failures});
})();
</script>
