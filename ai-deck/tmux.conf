# tmux inside ai-deck. The browser is the only client, so the status bar
# is just a lost row on a phone screen; and the Esc key on the toolbar must
# reach Claude Code immediately rather than wait for tmux's meta-key timeout.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -sg escape-time 10
set -g history-limit 20000
set -g status off
set -g mouse off
set -g focus-events on
# Size the window to the client that last did something, not to the smallest
# attached one. Two clients per desk is allowed (a phone and a laptop), and
# the default would clamp the laptop to the phone's ~40 columns — which also
# flips statusline.sh into its mobile layout on the wide screen.
set -g window-size latest
# `on`, not the default `external`: Claude Code copies a selection with
# `tmux load-buffer -w`, and tmux only forwards that to the outer terminal as
# OSC 52 when it is allowed to set the clipboard itself. `external` only lets
# applications' own OSC 52 through. The outer terminal is xterm.js in the
# browser, which catches the sequence in ui/app.js.
set -g set-clipboard on
# MiMoCode does not hand its selection to tmux the way Claude Code does: it
# writes OSC 52 itself and, on seeing $TMUX, wraps it in a DCS passthrough
# (ESC P tmux; …). tmux 3.3 drops that unless passthrough is allowed, so the
# copy silently went nowhere. On, the sequence reaches xterm.js and the same
# handler in ui/app.js catches it.
# The cost: any program in this container can then write straight to the
# browser's terminal. Bash in here is already trusted (permission prompts are
# off for both agents), so this changes nothing that was not already true.
set -g allow-passthrough on
set -g default-command "cd /work && exec bash -l"
