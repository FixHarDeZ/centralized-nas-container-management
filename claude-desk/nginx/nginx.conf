# claude-desk edge: static UI + websocket to ttyd + read-only file listing.
# Everything is behind basic auth — a shell with permission prompts off sits
# on the other side of this file.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    auth_basic           "claude-desk";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Our own page instead of ttyd's — ttyd only ever sees /ws and /token.
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(woff2|js|css|svg|png|webmanifest)$ {
        root  /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /token {
        proxy_pass http://claude-desk:7681/token;
    }

    location = /ws {
        proxy_pass          http://claude-desk:7681/ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_set_header    Host       $http_host;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
    }

    # Finished documents. JSON for the in-page drawer, the file itself when
    # a name is tapped — iOS previews pptx/xlsx inline, so no attachment
    # header. Upload stays in DS File; nothing here writes.
    location /files/ {
        alias               /files/out/;
        autoindex           on;
        autoindex_format    json;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-store";
    }
}
