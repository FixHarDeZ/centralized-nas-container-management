# claude-desk edge: static UI + websocket to ttyd + read-only file listing.
# Everything is behind basic auth — a shell with permission prompts off sits
# on the other side of this file.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    auth_basic           "claude-desk";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Our own page instead of ttyd's — ttyd only ever sees /ws and /token.
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
    }
    # Third-party libraries and fonts are pinned files that never change
    # without a new image — a week of caching costs nothing.
    location ~* ^/(vendor|fonts)/ {
        root  /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800";
    }
    # Our own page, however, does change, and this desk is installed to a home
    # screen as a PWA: a week-long cache meant a UI fix silently did not reach
    # the phone until the browser felt like refetching. Revalidate every load;
    # the 304 is one round trip on a file of a few tens of KB.
    location ~* \.(js|css|svg|png|webmanifest)$ {
        root  /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /token {
        proxy_pass http://claude-desk:7681/token;
    }

    location = /ws {
        proxy_pass          http://claude-desk:7681/ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_set_header    Host       $http_host;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
    }

    # The share, read-only: /files/in/ and /files/out/ list as JSON for the
    # drawer and serve the file itself when a name is tapped (iOS previews
    # pptx/xlsx inline, so no attachment header). The share root itself is
    # not listed — it would show #recycle and @eaDir.
    location = /files/ { return 404; }
    location /files/ {
        alias               /files/;
        autoindex           on;
        autoindex_format    json;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-store";
    }

    # Upload side: the desk container's upload.py writes PUT bodies into
    # /work/in. Size cap lives here; DSM's reverse proxy has its own.
    location /upload/ {
        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_pass          http://claude-desk:7682;
        proxy_http_version  1.1;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }
}
