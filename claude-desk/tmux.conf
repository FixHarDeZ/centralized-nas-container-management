# tmux inside claude-desk. The browser is the only client, so the status bar
# is just a lost row on a phone screen; and the Esc key on the toolbar must
# reach Claude Code immediately rather than wait for tmux's meta-key timeout.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -sg escape-time 10
set -g history-limit 20000
set -g status off
set -g mouse off
set -g focus-events on
set -g default-command "cd /work && exec bash -l"
