<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desk">
  <title>claude-desk</title>
  <script>
    // Before the stylesheet, so a light-preference phone never flashes dark.
    // app.js owns the same resolution afterwards; this is only the first paint.
    (function () {
      var t = 'dark';
      try {
        var saved = localStorage.getItem('claude-desk.theme');
        t = (saved === 'dark' || saved === 'light') ? saved
          : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        var forced = new URLSearchParams(location.search).get('theme');
        if (forced === 'dark' || forced === 'light') t = forced;
      } catch (e) { /* private mode: stay dark */ }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="top">
    <div class="brand">
      <span class="dot" id="status-dot"></span>
      <span class="name">claude<span class="accent">-desk</span></span>
    </div>
    <div class="top-actions">
      <!-- Two rows rather than one line: the reset countdown is the half that
           decides whether to wait or stop, and 5h + wk + both countdowns do
           not fit across a phone. -->
      <button id="quota" class="quota" type="button" hidden title="Rate limits">
        <span class="q-row q-5h" hidden><b>5h</b><span class="q-pct"></span><span class="q-in"></span></span>
        <span class="q-row q-wk" hidden><b>wk</b><span class="q-pct"></span><span class="q-in"></span></span>
      </button>
      <span id="status-text" class="status">connecting</span>
      <!-- Two views over the same desk. The terminal is the whole desk (shell,
           mimo, ask); chat drives a second Claude Code over a documented
           protocol, and reflows, which a 40-column terminal cannot. -->
      <div class="views" role="tablist">
        <button id="view-term" class="view on" role="tab" title="Terminal">
          <svg viewBox="0 0 24 24"><path d="M4 6l6 6-6 6M13 18h7"/></svg>
        </button>
        <button id="view-chat" class="view" role="tab" title="Chat">
          <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5.1A8 8 0 1 1 21 12z"/></svg>
        </button>
      </div>
      <button id="sessions-btn" class="icon-btn" title="Past sessions" aria-label="Past sessions">
        <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4.7V9h4.3M12 7.5V12l3 1.8"/></svg>
      </button>
      <button id="theme-btn" class="icon-btn" title="Switch theme" aria-label="Switch theme">
        <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg>
      </button>
      <button id="files-btn" class="icon-btn" title="Files in out/" aria-label="Files">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button id="toolbar-btn" class="icon-btn" title="Toggle key bar" aria-label="Key bar">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
      </button>
    </div>
  </header>

  <main id="terminal"></main>

  <section id="chat" hidden>
    <div class="chat-bar">
      <!-- Says when the terminal has an agent open too: two Claude Codes can
           be working in /work at once now, and that is worth knowing rather
           than preventing (see chat.py). -->
      <span id="chat-state" class="chat-state"></span>
      <button id="chat-new" class="chat-new" type="button">New chat</button>
    </div>
    <div id="chat-log" class="chat-log"></div>
    <div id="chat-note" class="chat-note" hidden></div>
    <form id="chat-form" class="chat-form">
      <textarea id="chat-input" rows="1" placeholder="พิมพ์ข้อความ…"
                enterkeyhint="send" autocomplete="off" autocapitalize="sentences"></textarea>
      <button id="chat-send" type="submit" class="chat-send" aria-label="Send">
        <svg class="ico-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 8 6 8z"/></svg>
        <svg class="ico-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
    </form>
  </section>

  <nav id="toolbar" aria-label="Terminal keys">
    <div class="row keys">
      <button data-key="esc">Esc</button>
      <button data-key="shifttab" title="Cycle Claude mode">⇧Tab</button>
      <button data-key="tab">Tab</button>
      <button data-mod="ctrl" title="Ctrl, one-shot">Ctrl</button>
      <button data-key="up" aria-label="Up">↑</button>
      <button data-key="down" aria-label="Down">↓</button>
      <button data-key="left" aria-label="Left">←</button>
      <button data-key="right" aria-label="Right">→</button>
      <button data-key="newline" class="accent" title="New line without sending">↵ NL</button>
    </div>
    <div class="row utils">
      <button id="copy-btn" title="Copy the selection">⧉ Copy</button>
      <button id="paste-btn" title="Paste from clipboard">⎘ Paste</button>
      <button data-key="slash" title="Slash command">/</button>
      <button data-key="ctrlc" title="Interrupt (Ctrl-C)">^C</button>
      <button id="font-minus" aria-label="Smaller text">A−</button>
      <button id="font-plus" aria-label="Larger text">A+</button>
      <button id="kb-btn" class="svg-btn" title="Show/hide keyboard" aria-label="Keyboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
      </button>
    </div>
  </nav>

  <aside id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="tabs" role="tablist">
        <button class="tab" data-dir="in" role="tab">in/</button>
        <button class="tab on" data-dir="out" role="tab">out/</button>
      </div>
      <button id="drawer-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-sub" id="drawer-sub">finished files · tap to open, ⬇ to save</div>
    <div class="drawer-actions" id="in-actions" hidden>
      <input type="file" id="file-input" multiple hidden>
      <button id="add-btn" class="add-btn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Add files
      </button>
      <div id="upload-status" class="upload-status" hidden></div>
    </div>
    <ul id="file-list" class="file-list"></ul>
    <div id="file-empty" class="file-empty" hidden></div>
    <div class="drawer-foot">
      <button id="clear-btn" class="clear-btn" hidden>
        <svg viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        <span id="clear-label">Clear</span>
      </button>
    </div>
  </aside>

  <!-- Past Claude Code sessions in /work. Tapping one types
       `claude --resume <id>` into the tmux pane (see upload.py) — the shell
       is the only thing that can start it, so the sheet refuses while a
       program is already holding the pane. -->
  <aside id="sessions" aria-hidden="true">
    <div class="drawer-head">
      <div class="sheet-title">Sessions</div>
      <button id="sessions-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-sub" id="sessions-sub">past work in <code>/work</code> · tap to resume</div>
    <div class="drawer-actions">
      <button id="new-session" class="add-btn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New session
      </button>
    </div>
    <ul id="session-list" class="file-list"></ul>
    <div id="session-empty" class="file-empty" hidden></div>
    <!-- Lives here because turning it on has to be a tap: Safari only grants
         notification permission from a user gesture. -->
    <div class="drawer-foot">
      <button id="notify-btn" class="clear-btn" type="button">
        <svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6M13.7 20a2 2 0 0 1-3.4 0"/></svg>
        <span id="notify-label">Notify when Claude finishes</span>
      </button>
    </div>
  </aside>

  <div id="scrim"></div>

  <script src="vendor/xterm.min.js"></script>
  <script src="vendor/xterm-addon-fit.min.js"></script>
  <script src="vendor/xterm-addon-web-links.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
