server {
    listen 80;

    # everything behind basic auth — no public endpoints. the container's own
    # healthcheck hits dupe-sweeper:8000 directly, so nginx never needs an open route.
    location / {
        auth_basic           "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass          http://dupe-sweeper:8000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering     off;
        proxy_read_timeout  600s;    # large-tree scans can run long
    }
}
