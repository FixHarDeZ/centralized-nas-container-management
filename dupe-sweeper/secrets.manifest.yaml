# App itself needs no secrets — dashboard auth lives in nginx/.htpasswd,
# generated from vault creds stacks.dupe_sweeper.dashboard.* at setup time.
# This .env exists only for deploy.sh's pre-upload check + runtime literals.
env: {}

literals:
  DATA_DIR:    /data
  SCAN_ROOTS:  /media/porn
  TRASH_DIR:   /media/porn/.dupe-sweeper-trash
