services:
  hermes-gateway:
    build:
      context: .
      args:
        HERMES_REF: v0.22.7
    image: hermes-agent
    container_name: hermes-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Bangkok
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-100}
      - HERMES_HOME=/opt/data
      - TELEGRAM_BOT_TOKEN=${HERMES_TELEGRAM_BOT_TOKEN}
    volumes:
      - hermes_agent_data:/opt/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    # No published ports: the webhook platform (8644, n8n Clip Intake → Hermes) was
    # switched off 2026-11-10 — never carried real traffic, and it fed outside input
    # into a session with a terminal on the box that holds the NAS key + age key.
    # Every tool process (claude -p children, ffmpeg, faster-whisper, numpy)
    # runs inside this cgroup. Unfenced, a 3-way async delegation on
    # 2026-11-05 drove the 12 GB host into swap thrash (no OOM kill, sshd and
    # nginx stopped answering, needed a power cycle). memswap_limit == mem_limit
    # = no swap for this container, so the cgroup OOM-kills a child instead of
    # the host livelocking. Keep below half of host RAM.
    mem_limit: 4g
    memswap_limit: 4g

    command: ["gateway", "run"]

  hermes-dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    depends_on:
      - hermes-gateway
    env_file: .env
    environment:
      - TZ=Asia/Bangkok
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-100}
      - HERMES_HOME=/opt/data
      - TELEGRAM_BOT_TOKEN=${HERMES_TELEGRAM_BOT_TOKEN}
      - DASHBOARD_BASIC_AUTH_USER=${DASHBOARD_BASIC_AUTH_USER:-fixhardez}
      - DASHBOARD_PASSWORD_HASH=${DASHBOARD_PASSWORD_HASH}
    ports:
      - "5063:9119"
    volumes:
      - hermes_agent_data:/opt/data
      - ./scripts/inject-dashboard-auth.sh:/opt/inject-dashboard-auth.sh:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    mem_limit: 1g
    memswap_limit: 1g
    entrypoint: ["/opt/inject-dashboard-auth.sh", "/init", "/opt/hermes/docker/main-wrapper.sh"]
    command: ["dashboard", "--host", "0.0.0.0", "--no-open"]

volumes:
  hermes_agent_data:
