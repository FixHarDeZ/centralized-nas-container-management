---
# ─── Homepage Settings ────────────────────────────────────────────────────────
title: Fix's NAS Dashboard
description: Synology DS925+ Home Lab

# ─── Theme ────────────────────────────────────────────────────────────────────
color: slate  # เทาน้ำเงินเข้มโมเดิร์น (zinc/neutral ก็เข้มได้)
theme: dark    # ธีมมืดเพื่อความ modern

# ─── Background ───────────────────────────────────────────────────────────────
# รูป: Unsplash (Zermatt sunrise) — ไฟล์อยู่ homepage/images/ mount เป็น /app/public/images
background:
  image: /images/background.jpg
  blur: md          # เบลอพอให้รายละเอียดรูปไม่แย่งตัวอักษร
  saturate: 80
  brightness: 45    # หรี่ลงให้การ์ด/ตัวอักษรเด่น
  opacity: 100
cardBlur: xl        # กระจกฝ้าหนา + custom.css ทำให้การ์ดทึบขึ้น

# ─── Layout ───────────────────────────────────────────────────────────────────
layout:
  📥 Downloads & Monitoring:
    style: row
    columns: 4
    
  📝 Tools & Notes:
    style: row
    columns: 3

  🌐 Remote Access:
    style: row
    columns: 3

  🏠 Local Network:
    style: row
    columns: 3

# ─── Misc ─────────────────────────────────────────────────────────────────────
headerStyle: boxedWidgets  # การ์ดมุมมน ดูโมเดิร์น
language: en
showStats: true