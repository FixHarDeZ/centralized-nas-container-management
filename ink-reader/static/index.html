<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b09">
<title>ink-reader</title>
<style>
  :root {
    --bg: #0c0b09;
    --surface: #15130f;
    --surface-2: #1d1a14;
    --border: rgba(239, 229, 207, 0.1);
    --text: #efe5cf;
    --text-dim: #9c9280;
    --accent: #c8a86a;
    --accent-soft: rgba(200, 168, 106, 0.12);
    --red: #d9776a;
    --red-soft: rgba(217, 119, 106, 0.12);
    --serif: "Iowan Old Style", "Noto Serif Thai", "Sukhumvit Set", Georgia, serif;
    --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Sukhumvit Set", sans-serif;
    line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }

  /* ── Header ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(12, 11, 9, 0.9);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    padding: calc(0.8rem + env(safe-area-inset-top)) 1.1rem 0.7rem;
  }
  .header-top { display: flex; align-items: center; gap: 0.6rem; }
  header h1 {
    font-family: var(--serif); font-size: 1.45rem; font-weight: 500;
    letter-spacing: 0.02em; white-space: nowrap;
  }
  header h1 span { color: var(--accent); font-style: italic; }
  .header-actions { display: flex; gap: 0.45rem; margin-left: auto; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; font-size: 1rem;
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .icon-btn:active, .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .btn-scrape {
    height: 38px; padding: 0 1.1rem; cursor: pointer;
    border-radius: 999px; font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    background: var(--accent); color: var(--bg); border: 1px solid var(--accent);
    transition: filter 0.15s;
  }
  .btn-scrape:hover { filter: brightness(1.08); }
  .btn-scrape:disabled { opacity: 0.5; cursor: default; }

  /* ── Filter tabs ── */
  .tabs {
    display: flex; gap: 1.4rem; margin-top: 0.7rem;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 0.3rem 0; font-size: 0.88rem; cursor: pointer; white-space: nowrap;
    background: none; border: none; color: var(--text-dim);
    border-bottom: 1px solid transparent; transition: color 0.15s;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  /* ── Stats ── */
  .stats-row {
    display: flex; gap: 0.3rem 1.1rem; margin-top: 0.55rem; flex-wrap: wrap;
    font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.02em;
  }
  .stats-row strong { color: var(--text); font-weight: 500; }

  /* ── Grid / cards ── */
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 1.6rem 1.1rem; padding: 1.3rem 1.1rem;
    max-width: 1400px; margin: 0 auto;
  }
  .card { display: flex; flex-direction: column; min-width: 0; }
  .card-img-wrap {
    position: relative; display: block; border-radius: var(--radius);
    overflow: hidden; background: var(--surface);
    box-shadow: 0 10px 28px -12px rgba(0, 0, 0, 0.8);
  }
  .card-img-wrap::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 0 0 1px var(--border); pointer-events: none;
  }
  .card img {
    width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block;
    transition: transform 0.35s ease;
  }
  .card-img-wrap:active img, .card-img-wrap:hover img { transform: scale(1.03); }
  .badge {
    position: absolute; padding: 0.15rem 0.5rem; border-radius: 999px;
    font-size: 0.64rem; letter-spacing: 0.03em; color: var(--text);
    background: rgba(12, 11, 9, 0.72); backdrop-filter: blur(4px);
  }
  .badge-source { top: 8px; left: 8px; }
  .badge-pages { bottom: 8px; right: 8px; }
  .badge-pages.long { background: var(--accent); color: var(--bg); font-weight: 600; }
  .progress {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: rgba(239, 229, 207, 0.15);
  }
  .progress i { display: block; height: 100%; background: var(--accent); }
  .card .body { padding-top: 0.65rem; display: flex; flex-direction: column; gap: 0.25rem; }
  .card .title {
    font-family: var(--serif); font-size: 0.9rem; line-height: 1.45;
    color: var(--text); text-decoration: none;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 2.9em;
  }
  .card .sub {
    display: flex; align-items: center; gap: 0.35rem;
    font-size: 0.7rem; color: var(--text-dim); white-space: nowrap;
  }
  .card .exp.soon { color: var(--red); }
  .actions { display: flex; gap: 0.15rem; margin-left: auto; }
  .actions > * {
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: transparent; color: var(--text-dim); cursor: pointer;
    display: grid; place-items: center; text-decoration: none;
    transition: color 0.15s, background 0.15s;
  }
  .actions svg { width: 16px; height: 16px; }
  .dl-btn:hover, .dl-btn:active { color: var(--accent); background: var(--accent-soft); }
  .del:hover, .del:active { color: var(--red); background: var(--red-soft); }

  .empty {
    grid-column: 1 / -1; text-align: center; padding: 5rem 1rem;
    color: var(--text-dim); font-family: var(--serif); font-size: 1rem;
  }
  .empty .glyph { display: block; width: 40px; height: 1px; background: var(--accent); margin: 0 auto 1.2rem; }

  /* ── Pager ── */
  .pager {
    display: flex; align-items: center; justify-content: center; gap: 1rem;
    padding: 0.5rem 1rem 2rem; color: var(--text-dim); font-size: 0.82rem;
  }
  .pager button {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 999px; padding: 0.55rem 1.2rem; cursor: pointer; font-size: 0.82rem;
  }
  .pager button:disabled { opacity: 0.3; cursor: default; }

  /* ── Settings dialog ── */
  dialog {
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); color: var(--text);
    padding: 1.4rem; width: min(92vw, 360px);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(3px); }
  dialog h2 { font-family: var(--serif); font-weight: 500; font-size: 1.2rem; margin-bottom: 1.1rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.35rem; }
  .field input {
    width: 100%; height: 44px; padding: 0 0.8rem; font-size: 1rem;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .field .hint { font-size: 0.7rem; color: var(--text-dim); margin-top: 0.3rem; }
  .dialog-actions { display: flex; gap: 0.5rem; margin-top: 1.2rem; }
  .dialog-actions button {
    flex: 1; height: 42px; border-radius: 999px; font-size: 0.85rem;
    cursor: pointer; border: 1px solid var(--border);
  }
  .btn-cancel { background: transparent; color: var(--text-dim); }
  .btn-save { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  #settings-msg { font-size: 0.75rem; color: var(--red); min-height: 1em; margin-top: 0.4rem; }

  /* ── Go-to-top ── */
  #btn-go-top {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right: 16px;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--surface-2); color: var(--accent);
    border: 1px solid var(--accent); cursor: pointer;
    display: grid; place-items: center; font-size: 17px;
    box-shadow: 0 8px 22px -6px rgba(0, 0, 0, 0.7);
    opacity: 0; transform: translateY(12px); pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 200;
  }
  #btn-go-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

  @media (max-width: 480px) {
    #grid { grid-template-columns: repeat(2, 1fr); gap: 1.3rem 0.8rem; padding: 1rem 0.9rem; }
    header { padding-left: 0.9rem; padding-right: 0.9rem; }
  }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1>ink <span>reader</span></h1>
    <div class="header-actions">
      <button class="icon-btn" id="btn-settings" title="ตั้งค่า" aria-label="Settings">⚙</button>
      <button class="icon-btn" id="refresh" title="Refresh" aria-label="Refresh">↻</button>
      <button class="btn-scrape" id="scrape">Scrape</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-f="all">ทั้งหมด</button>
    <button class="tab" data-f="long" id="tab-long">หน้าเยอะ</button>
  </div>
  <div class="stats-row" id="stats"></div>
</header>

<div id="grid"></div>
<div class="pager" id="pager"></div>

<dialog id="settings-dialog">
  <h2>ตั้งค่า</h2>
  <form method="dialog" id="settings-form">
    <div class="field">
      <label for="set-retention">เก็บเรื่องใหม่ไว้กี่วัน</label>
      <input id="set-retention" type="number" min="1" max="3650" inputmode="numeric" required>
      <div class="hint">ครบกำหนดแล้วลบไฟล์อัตโนมัติ (มีผลกับเรื่องที่มีอยู่ด้วย)</div>
    </div>
    <div class="field">
      <label for="set-minpages">หน้าเยอะ = ตั้งแต่กี่หน้าขึ้นไป</label>
      <input id="set-minpages" type="number" min="1" max="1000" inputmode="numeric" required>
      <div class="hint">ใช้กับแท็บ "หน้าเยอะ" และหมวด OPDS บนเครื่องอ่าน</div>
    </div>
    <div id="settings-msg"></div>
    <div class="dialog-actions">
      <button type="button" class="btn-cancel" id="settings-cancel">ยกเลิก</button>
      <button type="submit" class="btn-save" id="settings-save">บันทึก</button>
    </div>
  </form>
</dialog>

<button id="btn-go-top" title="กลับขึ้นบน" aria-label="Go to top">↑</button>

<script>
const PAGE_SIZE = 60;
const SOURCE_LABELS = { doujinth: "doujin-th" };

let filter = "all";
let page = 1;
let settings = { retention_days: 30, min_pages: 30 };

const $ = id => document.getElementById(id);

function fmtSize(b) {
  if (!b) return "";
  return b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : (b / 1024 | 0) + " KB";
}

function daysLeft(iso) {
  if (!iso) return null;
  return Math.max(0, Math.ceil((new Date(iso) - Date.now()) / 86400000));
}

function renderStats(stats, sources, last) {
  const n = stats?.new || { count: 0, size: 0 };
  let html = `<span>ทั้งหมด <strong>${n.count}</strong> ${fmtSize(n.size)}</span>`;
  for (const [name, d] of Object.entries(sources || {})) {
    html += `<span>${SOURCE_LABELS[name] || name} <strong>${d.count}</strong></span>`;
  }
  if (last && last.run_at !== "-") {
    const t = esc(last.run_at);  // db.last_scrape() pre-formats this for the homepage widget
    html += `<span>อัปเดต <strong>${t}</strong></span>`;
    if (last.error) html += `<span style="color:var(--red)">⚠ ${esc(last.error)}</span>`;
  }
  $("stats").innerHTML = html;
}

async function loadStats() {
  const s = await (await fetch("/api/status")).json();
  renderStats(s.stats, s.sources, s.last_scrape);
}

async function loadSettings() {
  settings = await (await fetch("/api/settings")).json();
  $("tab-long").textContent = `หน้าเยอะ ${settings.min_pages}+`;
}

const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>';
const ICON_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function cardHTML(t) {
  const dl = daysLeft(t.expires_at);
  const srcLabel = SOURCE_LABELS[t.source] || t.source || "";
  const isLong = (t.pages || 0) >= settings.min_pages;
  // Reading position written by reader.html; 1 = not started or finished.
  const pos = +localStorage.getItem(`ink-pos-${t.id}`);
  const pct = pos > 1 && t.pages ? Math.min(100, Math.round(pos / t.pages * 100)) : 0;
  return `
    <a class="card-img-wrap" href="/read/${t.id}">
      <img src="/covers/${t.id}.jpg" loading="lazy" alt="">
      ${srcLabel ? `<span class="badge badge-source">${esc(srcLabel)}</span>` : ""}
      <span class="badge badge-pages${isLong ? " long" : ""}">${t.pages} หน้า</span>
      ${pct ? `<span class="progress"><i style="width:${pct}%"></i></span>` : ""}
    </a>
    <div class="body">
      <a class="title" href="/read/${t.id}">${esc(t.title)}</a>
      <div class="sub">
        <span class="exp${dl !== null && dl <= 3 ? " soon" : ""}">อีก ${dl} วัน</span>
        <span>· ${fmtSize(t.file_size)}</span>
        <div class="actions">
          <a class="dl-btn" href="/files/${t.id}.cbz" download title="ดาวน์โหลด CBZ" aria-label="ดาวน์โหลด">${ICON_DL}</a>
          <button class="del" data-id="${t.id}" title="ลบ" aria-label="ลบ">${ICON_DEL}</button>
        </div>
      </div>
    </div>`;
}

async function load() {
  const data = await (await fetch("/api/titles?status=new")).json();
  let all = data.titles || [];
  if (filter === "long") all = all.filter(t => (t.pages || 0) >= settings.min_pages);

  const grid = $("grid");
  grid.innerHTML = "";
  const totalPages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
  page = Math.min(page, totalPages);
  const titles = all.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  if (!titles.length) {
    grid.innerHTML = '<div class="empty"><span class="glyph"></span>ไม่มีเรื่องในหมวดนี้</div>';
  }
  for (const t of titles) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = cardHTML(t);
    grid.appendChild(card);
  }
  renderPager(totalPages);
  loadStats();
}

function renderPager(totalPages) {
  const pager = $("pager");
  if (totalPages <= 1) { pager.innerHTML = ""; return; }
  pager.innerHTML = `
    <button id="pg-prev" ${page <= 1 ? "disabled" : ""}>← ก่อนหน้า</button>
    <span>หน้า ${page} / ${totalPages}</span>
    <button id="pg-next" ${page >= totalPages ? "disabled" : ""}>ถัดไป →</button>`;
  $("pg-prev")?.addEventListener("click", () => { page--; load(); window.scrollTo({ top: 0 }); });
  $("pg-next")?.addEventListener("click", () => { page++; load(); window.scrollTo({ top: 0 }); });
}

$("grid").addEventListener("click", async (e) => {
  const btn = e.target.closest("button.del");
  if (!btn) return;
  if (!confirm("ลบเรื่องนี้ทิ้งถาวร?")) return;
  await fetch(`/api/titles/${btn.dataset.id}/delete`, { method: "POST" });
  load();
});

document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    filter = b.dataset.f;
    page = 1;
    load();
  })
);

$("scrape").addEventListener("click", async () => {
  const btn = $("scrape");
  btn.textContent = "Scraping…";
  btn.disabled = true;
  await fetch("/api/scrape", { method: "POST" });
  setTimeout(() => { btn.textContent = "Scrape"; btn.disabled = false; load(); }, 3000);
});

$("refresh").addEventListener("click", () => load());

/* ── Settings dialog ── */
$("btn-settings").addEventListener("click", () => {
  $("set-retention").value = settings.retention_days;
  $("set-minpages").value = settings.min_pages;
  $("settings-msg").textContent = "";
  $("settings-dialog").showModal();
});
$("settings-cancel").addEventListener("click", () => $("settings-dialog").close());
$("settings-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch("/api/settings", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      retention_days: +$("set-retention").value,
      min_pages: +$("set-minpages").value,
    }),
  });
  if (!r.ok) {
    $("settings-msg").textContent = (await r.json()).detail || "บันทึกไม่สำเร็จ";
    return;
  }
  settings = await r.json();
  $("tab-long").textContent = `หน้าเยอะ ${settings.min_pages}+`;
  $("settings-dialog").close();
  load();
});

/* ── Go-to-top ── */
(function () {
  const btn = $("btn-go-top");
  window.addEventListener("scroll", () => {
    btn.classList.toggle("visible", window.scrollY > 200);
  }, { passive: true });
  btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
})();

loadSettings().then(load);
</script>
</body>
</html>
