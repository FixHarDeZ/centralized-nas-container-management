<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b09">
<title>ink-reader</title>
<style>
  :root {
    --bg: #0c0b09;
    --cream: #efe5cf;
    --dim: #9c9280;
    --gold: #c8a86a;
    --line: rgba(239, 229, 207, 0.12);
    --serif: "Iowan Old Style", "Noto Serif Thai", "Sukhumvit Set", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); color: var(--cream);
    font-family: system-ui, -apple-system, "Sukhumvit Set", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Chrome (auto-hides while reading) ── */
  .bar {
    position: fixed; left: 0; right: 0; z-index: 10;
    background: rgba(12, 11, 9, 0.9);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    transition: transform 0.25s ease;
  }
  .top {
    top: 0; border-bottom: 1px solid var(--line);
    padding: calc(0.55rem + env(safe-area-inset-top)) 0.9rem 0.55rem;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .bottom {
    bottom: 0; border-top: 1px solid var(--line);
    padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 0.9rem;
    font-size: 0.78rem; color: var(--dim); font-variant-numeric: tabular-nums;
  }
  body.hide .top { transform: translateY(-100%); }
  body.hide .bottom { transform: translateY(100%); }
  .back {
    width: 38px; height: 38px; flex: none; display: grid; place-items: center;
    border-radius: 50%; border: 1px solid var(--line);
    color: var(--cream); text-decoration: none; font-size: 1.1rem;
  }
  .top h1 {
    font-family: var(--serif); font-weight: 500; font-size: 0.98rem;
    letter-spacing: 0.01em; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .top h1 { flex: 1; min-width: 0; }
  .like {
    width: 38px; height: 38px; flex: none; display: grid; place-items: center;
    border-radius: 50%; border: 1px solid var(--line); background: none;
    color: var(--dim); cursor: pointer;
  }
  .like svg { width: 18px; height: 18px; }
  .like.on { color: var(--gold); border-color: var(--gold); }
  .like.on svg { fill: currentColor; }
  .track { flex: 1; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--gold); transition: width 0.2s; }

  /* ── Pages ── */
  main { max-width: 900px; margin: 0 auto; }
  .pg {
    display: block; width: 100%; height: auto;
    min-height: 60vh; background: #14120e;
  }
  .pg.ok { min-height: 0; background: none; }
  .end {
    text-align: center; padding: 3.5rem 1.5rem calc(6rem + env(safe-area-inset-bottom));
    color: var(--dim);
  }
  .end .rule { width: 48px; height: 1px; background: var(--gold); margin: 0 auto 1.4rem; }
  .end p { font-family: var(--serif); font-size: 1.1rem; color: var(--cream); margin-bottom: 1.4rem; }
  .end a {
    display: inline-block; padding: 0.7rem 1.6rem; border-radius: 999px;
    border: 1px solid var(--gold); color: var(--gold); text-decoration: none;
    font-size: 0.85rem; letter-spacing: 0.04em;
  }
  .msg { padding: 40vh 1.5rem 0; text-align: center; color: var(--dim); }
</style>
</head>
<body>
<div class="bar top">
  <a class="back" href="/" aria-label="กลับ">‹</a>
  <h1 id="title">…</h1>
  <button class="like" id="like" aria-label="ชอบ" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg></button>
</div>
<main id="pages"></main>
<div class="bar bottom">
  <span id="count">–</span>
  <div class="track"><div class="fill" id="fill"></div></div>
  <span id="pct">0%</span>
</div>

<script>
const tid = location.pathname.split("/").filter(Boolean)[1];
const KEY = `ink-pos-${tid}`;
const $ = id => document.getElementById(id);
let total = 0;
let current = 1;
// Held off until any resume scroll lands, so page 1 flashing past can't overwrite it.
let persist = false;

async function init() {
  const r = await fetch(`/api/titles/${tid}/pages`);
  if (!r.ok) { $("pages").innerHTML = '<p class="msg">ไม่พบเรื่องนี้แล้ว</p>'; return; }
  const info = await r.json();
  total = info.count;
  document.title = info.title;
  $("title").textContent = info.title;
  setLiked(info.liked);

  const main = $("pages");
  const seen = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting) setCurrent(+e.target.dataset.n);
  }, { rootMargin: "-45% 0px -45% 0px" });

  for (let n = 1; n <= total; n++) {
    const img = document.createElement("img");
    img.className = "pg";
    img.dataset.n = n;
    img.alt = "";
    // First few eager so the top of the story paints immediately.
    img.loading = n <= 3 ? "eager" : "lazy";
    img.decoding = "async";
    img.onload = () => { img.classList.add("ok"); img.style.aspectRatio = ""; };
    img.src = `/read/${tid}/${n}`;
    main.appendChild(img);
    seen.observe(img);
  }
  const end = document.createElement("div");
  end.className = "end";
  end.innerHTML = '<div class="rule"></div><p>จบเรื่อง</p><a href="/">กลับหน้าคลัง</a>';
  main.appendChild(end);

  // Once page 1 is in, size every unloaded page like it (doujin pages are
  // near-uniform) so lazy loads above a resume point don't push it down.
  const first = main.children[0];
  const shape = () => {
    const ratio = `${first.naturalWidth} / ${first.naturalHeight}`;
    for (const img of main.querySelectorAll(".pg:not(.ok)")) {
      img.style.aspectRatio = ratio;
      img.style.minHeight = "0";
    }
  };

  const saved = +localStorage.getItem(KEY);
  setCurrent(1);
  if (saved > 1 && saved <= total) {
    const target = main.children[saved - 1];
    const go = () => { shape(); target.scrollIntoView({ block: "start" }); setCurrent(saved); persist = true; };
    first.complete ? go() : first.addEventListener("load", go, { once: true });
  } else {
    persist = true;
    first.complete ? shape() : first.addEventListener("load", shape, { once: true });
  }
}

function setLiked(on) {
  $("like").classList.toggle("on", on);
  $("like").setAttribute("aria-pressed", on);
}

$("like").addEventListener("click", async (e) => {
  e.stopPropagation();
  const on = !$("like").classList.contains("on");
  const purge = !on && confirm("เอาออกจากเรื่องที่ชอบแล้ว — ลบทิ้งจาก NAS ทันทีเลยไหม?\n(ยกเลิก = เก็บไว้ นับวันหมดอายุใหม่)");
  setLiked(on);
  const r = await fetch(`/api/titles/${tid}/like`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ liked: on }),
  });
  if (!r.ok) setLiked(!on);
  else if (purge) {
    await fetch(`/api/titles/${tid}/delete`, { method: "POST" });
    location.href = "/";
  }
});

function setCurrent(n) {
  current = n;
  $("count").textContent = `${n} / ${total}`;
  const pct = total ? Math.round((n / total) * 100) : 0;
  $("fill").style.width = pct + "%";
  $("pct").textContent = pct + "%";
  if (persist) localStorage.setItem(KEY, n >= total ? 1 : n);
}

/* Hide chrome on scroll down, show on scroll up or tap. */
let lastY = 0;
window.addEventListener("scroll", () => {
  const y = window.scrollY;
  if (Math.abs(y - lastY) < 8) return;
  document.body.classList.toggle("hide", y > lastY && y > 80);
  lastY = y;
}, { passive: true });
$("pages").addEventListener("click", () => document.body.classList.toggle("hide"));

init();
</script>
</body>
</html>
