services:
  lotto-picker:
    build: .
    container_name: lotto-picker
    restart: unless-stopped
    expose:
      - "8000"
    env_file: .env
    environment:
      - TZ=Asia/Bangkok
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - lotto_picker_data:/data

  nginx:
    image: nginx:alpine
    container_name: lotto-picker-nginx
    restart: unless-stopped
    ports:
      - "5073:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    environment:
      - TZ=Asia/Bangkok
    mem_limit: 64m
    depends_on:
      - lotto-picker

volumes:
  lotto_picker_data:
