server {
    listen 80;

    # everything behind basic auth — no webhooks, nothing public. the app's
    # healthcheck hits lotto-picker:8000 directly.
    location / {
        auth_basic           "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass          http://lotto-picker:8000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout  300s;    # first pick with a long history backfills from GLO
    }
}
