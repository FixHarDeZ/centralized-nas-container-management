# Dashboard auth lives in nginx/.htpasswd, generated from vault
# stacks.lotto_picker.dashboard.* (see README) — not an app env var.
# Telegram reuses the news-feed bot: send-only, so no conflict with its updates.
env:
  LOTTO_TELEGRAM_BOT_TOKEN: stacks.news_feed.telegram.bot_token
  LOTTO_TELEGRAM_CHAT_ID:   stacks.news_feed.telegram.chat_id
  # Stats summary (app/insight.py). Optional: without it the template summary is used.
  MIMO_API_KEY:             shared.llm.mimo_api_key

literals:
  DATA_DIR:  /data
  PICK_TIME: "20:00"
  MIMO_BASE_URL: https://token-plan-sgp.xiaomimimo.com/v1
  MIMO_MODEL:    mimo-v2.5-pro
  MIMO_REASONING_EFFORT: low
