<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบบันทึกการทำงานแม่บ้าน</title>
  <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1d28" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/static/style.css?v=20261005" />

  <!-- Apply theme BEFORE first paint to avoid flash -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem("maidTrackerTheme");
        var theme = saved || "light";
        document.documentElement.setAttribute("data-bs-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-bs-theme", "light");
      }
    })();
  </script>
</head>
<body>
  <nav class="navbar sticky-top">
    <div class="container-lg nav-shell d-flex align-items-center justify-content-between">
      <a class="navbar-brand" id="navBrand" href="#/" onclick="navigate('/')">
        <span class="brand-mark"><i class="bi bi-house-heart-fill"></i></span>
        <span class="brand-copy"><strong id="brandText">ระบบบันทึกการทำงานแม่บ้าน</strong><small>HOUSEHOLD STAFF</small></span>
      </a>
      <div class="nav-links">
        <button class="nav-link-btn" data-nav="home" onclick="navigate('/')"><i class="bi bi-grid-1x2 me-1"></i><span id="navOverview">ภาพรวม</span></button>
        <button class="nav-link-btn" data-nav="reminders" onclick="navigate('/reminders')"><i class="bi bi-bell me-1"></i><span id="navReminders">การแจ้งเตือน</span></button>
      </div>
      <div class="nav-tools d-flex gap-2 align-items-center">
        <button id="themeToggle" class="nav-icon-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <button id="langToggle" class="nav-icon-btn" onclick="switchLang()">EN</button>
      </div>
    </div>
  </nav>

  <main id="app" class="container-lg py-4 px-3"></main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js?v=20261005"></script>
</body>
</html>
