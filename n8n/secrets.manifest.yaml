# Vault paths stay at stacks.secretary.n8n.* after the stack split — the path in
# the vault does not have to match the stack directory, and renaming it would
# mean an extra `make edit-vault` round for no functional gain.
env:
  N8N_BASIC_AUTH_USER:     stacks.secretary.n8n.basic_auth_user
  N8N_BASIC_AUTH_PASSWORD: stacks.secretary.n8n.basic_auth_password
  # Telegram accepts webhooks only on ports 80/88/443/8443, so this one must
  # stay on the :443 subdomain even though the dashboard moved to :15678.
  N8N_WEBHOOK_URL:         stacks.secretary.n8n.webhook_url
  N8N_EDITOR_BASE_URL:     stacks.secretary.n8n.editor_url
  # Not consumed by docker-compose — read by scripts/n8n_export.sh / n8n_import.sh
  N8N_API_KEY:             stacks.secretary.n8n.api_key
  # HMAC secret n8n signs clip-job POSTs with (Hermes webhook platform validates it)
  HERMES_WEBHOOK_SECRET:   stacks.secretary.n8n.hermes_webhook_secret

literals:
  GENERIC_TIMEZONE: Asia/Bangkok
  # Let the Code node read HERMES_WEBHOOK_SECRET via $env (n8n blocks env by default)
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  TZ:               Asia/Bangkok
