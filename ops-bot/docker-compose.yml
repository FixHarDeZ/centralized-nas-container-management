services:
  ops-bot:
    build: .
    container_name: ops-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Bangkok
    ports:
      - "5070:8000"
    volumes:
      - ops_bot_data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  ops_bot_data:
