server {
    listen 80;

    # Uptime Kuma posts here; it can't send basic auth credentials, so this
    # path stays open and the app verifies ?secret= against KUMA_WEBHOOK_SECRET
    # (constant-time compare in app/webhook.py). Same split friendly-reminder
    # uses for its LINE webhook.
    location = /webhook/uptime-kuma {
        proxy_pass          http://ops-bot:8000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # dashboard + everything else behind basic auth
    location / {
        auth_basic           "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass          http://ops-bot:8000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering     off;
    }
}
