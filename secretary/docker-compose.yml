services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: secretary-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"        # internal only ไม่ expose ออกนอก
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: n8nio/n8n:latest
    container_name: secretary-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=Asia/Bangkok
      - TZ=Asia/Bangkok
      - NODE_OPTIONS=--max-old-space-size=1024
    volumes:
      - n8n_data:/home/node/.n8n
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  secretary-query:
    build:
      context: ./query
      dockerfile: Dockerfile
    container_name: secretary-query
    restart: unless-stopped
    ports:
      - "5065:5065"
    env_file:
      - ./query/.env
      - ./ingest/.env
    environment:
      # 6 of 8 cores for query-path embedding (was 2 → embed stage took ~10s).
      # Leaves 2 cores of headroom for DSM / other stacks. Query traffic is a
      # single interactive user, so short bursts at 6 threads are fine.
      - OMP_NUM_THREADS=6
      - MKL_NUM_THREADS=6
      - TOKENIZERS_PARALLELISM=false
      # onnx = int8-quantized BGE-M3 via onnxruntime (2-4x faster on CPU).
      # Set to "torch" to fall back to FlagEmbedding.
      - EMBEDDING_BACKEND=onnx
      # Keep-warm: re-encode a dummy query every N seconds so the model stays
      # resident in RAM (cold start was 152s due to swap-out).
      - WARM_INTERVAL_SEC=300
    volumes:
      - hf_cache:/root/.cache/huggingface
      - /volume2/docker/secretary/query-data:/data
      - ./ingest/ingest.py:/ingest/ingest.py:ro
    depends_on:
      - qdrant
    deploy:
      resources:
        limits:
          # 4 GB, not 6: the NAS has 12 GB total, so a 6 GB ceiling let this one
          # container exhaust the *host* before its own cgroup limit ever tripped
          # — global OOM on 2026-08-19 killed dockerd and every stack with it.
          # /ingest-trigger no longer spawns a subprocess with its own BGE-M3
          # (it reuses the resident encoder), so steady state is ~0.9 GB and the
          # per-batch encode spike has to fit in the rest.
          # CPU is controlled at app level via OMP_NUM_THREADS above; Synology
          # DSM kernel lacks CFS scheduler so docker cpus: limits can't be applied.
          memory: 4G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  secretary-ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    container_name: secretary-ingest
    restart: "no"
    env_file: ./ingest/.env
    environment:
      - OMP_NUM_THREADS=3
      - MKL_NUM_THREADS=3
      - TOKENIZERS_PARALLELISM=false
    volumes:
      - ingest_state:/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
    deploy:
      resources:
        limits:
          # 6 GB: BGE-M3 + FlagEmbedding holds ~2 GB resident, but encoding a
          # batch of 20–50 chunks (dense + sparse + colbert outputs together)
          # transiently spikes past 4 GB. Confirmed by OOM kill on 2026-06-01
          # while ingesting the User-Password page at the 4 GB ceiling.
          memory: 6G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qdrant_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume2/docker/secretary/qdrant_storage

  n8n_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume2/docker/secretary/n8n_data

  ingest_state:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume2/docker/secretary/ingest_state

  hf_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume2/docker/secretary/hf_cache