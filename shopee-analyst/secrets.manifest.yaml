# Telegram reuses the news-feed bot: send-only, so no conflict with its updates.
# YouTube reuses shorts-factory's OAuth client (read-only calls) and so shares
# its Data API quota with real uploads — app/clips.py searches once per day.
# SHOPEE_APP_ID / SHOPEE_APP_SECRET are NOT mapped: the account has no Open API
# access and the vault has no stacks.shopee_analyst.shopee.* paths. A manifest
# entry pointing at a missing path makes `make secrets` fail for the whole
# repo — add the vault values first (make edit-vault), then uncomment.
env:
  TELEGRAM_BOT_TOKEN:    stacks.news_feed.telegram.bot_token
  TELEGRAM_CHAT_ID:      stacks.news_feed.telegram.chat_id
  YOUTUBE_CLIENT_ID:     stacks.shorts_factory.youtube.client_id
  YOUTUBE_CLIENT_SECRET: stacks.shorts_factory.youtube.client_secret
  YOUTUBE_REFRESH_TOKEN: stacks.shorts_factory.youtube.refresh_token
  # Product names + clip angles. Optional: without it the raw clip list goes out.
  MIMO_API_KEY:          shared.llm.mimo_api_key
  # SHOPEE_APP_ID:     stacks.shopee_analyst.shopee.app_id
  # SHOPEE_APP_SECRET: stacks.shopee_analyst.shopee.app_secret

literals:
  DATA_DIR: /data
  SLOTS: "06:00,12:00,16:00"
  SHOPEE_API_URL: https://open-api.affiliate.shopee.co.th/graphql
  MIMO_BASE_URL: https://token-plan-sgp.xiaomimimo.com/v1
  MIMO_MODEL:    mimo-v2.6-flash  # v2.5 retired (catalog 2026-11-02)
  MIMO_REASONING_EFFORT: low
