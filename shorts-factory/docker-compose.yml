services:
  shorts-factory:
    build: .
    container_name: shorts-factory
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Bangkok
    # No ports and no nginx sidecar: the whole interface is a Telegram
    # long-poll loop. See docs/adr/0002.
    volumes:
      - shorts_factory_data:/data
      - /volume1/shorts:/output
      # Read-only here on purpose: the dashboard owns this file and the bot
      # only obeys it. See docs/adr/0009.
      - shorts_factory_config:/config:ro
    # ffmpeg + Pillow are the memory spike here, and this host has already had a
    # whole-box OOM (2026-08-19), so cap memory. No `cpus:` — DSM's kernel has no
    # CFS bandwidth control and the daemon refuses to create the container:
    # "NanoCPUs can not be set, as your kernel does not support CPU CFS scheduler".
    mem_limit: 2g

  # The dashboard is a second process from the same image, with /data mounted
  # read-only: it reads the Manifests the bot writes and can never write back.
  # See docs/adr/0007. The bot above still publishes no port.
  shorts-factory-dashboard:
    build: .
    container_name: shorts-factory-dashboard
    restart: unless-stopped
    command: ["python", "-m", "app.dashboard"]
    # No `env_file: .env` on purpose. This is the only LAN-reachable process in
    # the stack and it needs no credential: the modules it imports read
    # DATA_DIR and nothing else, and `youtube.configured()` reads its env at
    # call time, which never happens here. Without the bot token and the
    # YouTube refresh token, this container cannot act even if it is reached.
    environment:
      - TZ=Asia/Bangkok
      - DATA_DIR=/data
    expose:
      - "8000"
    volumes:
      - shorts_factory_data:/data:ro
      # The one thing this container may write, and all it may write: the
      # trends schedule. Manifests, state and history stay :ro above.
      - shorts_factory_config:/config
    mem_limit: 256m
    depends_on:
      - shorts-factory

  shorts-factory-shop:
    build: .
    container_name: shorts-factory-shop
    restart: unless-stopped
    command: ["uvicorn", "app.shop_api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      - TZ=Asia/Bangkok
      - SHOP_ROOT=/shop-data
      - SHOP_MEDIA_ROOT=/output/shop-studio
      - SHOP_AUTOMATION_TOKEN=${SHOP_AUTOMATION_TOKEN}
    expose:
      - "8000"
    volumes:
      - shorts_factory_shop:/shop-data
      - /volume1/shorts:/output
    mem_limit: 384m

  shorts-factory-shop-worker:
    build: .
    container_name: shorts-factory-shop-worker
    restart: unless-stopped
    command: ["python", "-m", "app.shop_worker"]
    environment:
      - TZ=Asia/Bangkok
      - SHOP_ROOT=/shop-data
      - SHOP_MEDIA_ROOT=/output/shop-studio
      - SHOP_PUBLIC_URL=${SHOP_PUBLIC_URL:-}
      - OUTPUT_DIR=/output
      - DATA_DIR=/data
      - CONFIG_DIR=/config
      - BGM_DIR=/output/bgm
      - MIMO_API_KEY=${MIMO_API_KEY}
      - MIMO_BASE_URL=${MIMO_BASE_URL}
      - MIMO_MODEL=${MIMO_MODEL}
      - MIMO_TIMEOUT_SECONDS=${MIMO_TIMEOUT_SECONDS:-600}
      - MIMO_REASONING_EFFORT=${MIMO_REASONING_EFFORT:-low}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TTS_RATE=${TTS_RATE:-+10%}
    volumes:
      - shorts_factory_shop:/shop-data
      - shorts_factory_data:/data:ro
      - shorts_factory_config:/config:ro
      - /volume1/shorts:/output
    mem_limit: 2g

  nginx:
    image: nginx:alpine
    container_name: shorts-factory-nginx
    restart: unless-stopped
    ports:
      - "5071:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    environment:
      - TZ=Asia/Bangkok
    mem_limit: 64m
    depends_on:
      - shorts-factory-dashboard
      - shorts-factory-shop

volumes:
  shorts_factory_data:
  shorts_factory_config:
  shorts_factory_shop:
