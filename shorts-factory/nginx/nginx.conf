server {
    listen 80;
    server_name _;

    # Every path is behind basic auth. Unlike ops-bot there is no webhook that
    # cannot send credentials, so there is no exception to make.
    auth_basic "shorts-factory";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Shop browser and automation traffic both retain gateway authentication.
    # Automation additionally requires the scoped X-Shop-Token at the API.
    location = /shop {
        proxy_pass http://shorts-factory-shop:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $shop_forwarded_proto;
    }
    location /shop/ {
        client_max_body_size 102m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://shorts-factory-shop:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $shop_forwarded_proto;
    }

    location / {
        proxy_pass http://shorts-factory-dashboard:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# DSM terminates TLS; retain its scheme for same-origin checks. The backend
# itself has no published port. Local HTTP access falls back to nginx's scheme.
map $http_x_forwarded_proto $shop_forwarded_proto {
    default $scheme;
    https https;
    http http;
}
