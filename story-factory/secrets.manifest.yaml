# story-factory — literals only, on purpose.
#
# `env:` is deliberately absent. render_env.py raises `missing vault path` and
# breaks `make secrets` for the WHOLE repo if a manifest names a vault path that
# does not exist yet, and none of this stack's secrets are in the vault. The
# entries below are written out but commented, so the paths are decided and the
# ordering is documented rather than executed.
#
# Order when the credentials exist (reversing it breaks every stack):
#   1. `make edit-vault` -> put the value in secrets/vault.sops.yaml
#   2. only then uncomment the matching line here
#   3. `make secrets`
#
# env:
#   # Reuses the key news-feed and shorts-factory already share. No new secret.
#   MIMO_API_KEY:       shared.llm.mimo_api_key
#   # A NEW bot, not shorts-factory's. Two processes long-polling getUpdates on
#   # one token steal each other's messages.
#   TELEGRAM_BOT_TOKEN: stacks.story_factory.telegram.bot_token
#   TELEGRAM_CHAT_ID:   stacks.story_factory.telegram.chat_id
#   # Google service-account JSON, **base64-encoded to one line**. sops would
#   # hold the raw JSON fine, but render_env.py refuses to emit a newline into
#   # a .env ("docker-compose .env does not support multiline values").
#   # Requires Text-to-Speech API enabled in the shorts-factory GCP project.
#   GOOGLE_CREDENTIALS_B64: stacks.story_factory.google.credentials_b64

literals:
  MIMO_BASE_URL: https://token-plan-sgp.xiaomimimo.com/v1
  MIMO_MODEL:    mimo-v2.5-pro
  # A stalled response would otherwise hang the bot for 600s x retries. Shared
  # across every retry, not per attempt: the loop is driven by this deadline.
  MIMO_TIMEOUT_SECONDS: "600"
  # mimo-v2.5-pro is a reasoning model; the default thinking budget doubles
  # latency without writing anything better.
  MIMO_REASONING_EFFORT: low

  DATA_DIR:   /data
  OUTPUT_DIR: /output

  # --- TTS -------------------------------------------------------------------
  # PLACEHOLDER. Nobody has heard these voices yet. The shortlist and the three
  # other unanswered questions are in .notes/00_INDEX.md; they are settled by
  # firing the API once, not by reading more documentation.
  TTS_VOICE: th-TH-Chirp3-HD-Achernar
  TTS_LANGUAGE_CODE: th-TH
  # UNVERIFIED: two Google doc pages contradict each other on whether Chirp 3:
  # HD honours speaking_rate at all. 1.0 = no-op until measured.
  TTS_SPEAKING_RATE: "1.0"
  # Bytes per `synthesize` request. This is the endpoint's own ceiling, not a
  # tuning knob — there is no setting that raises it. Thai costs 3 bytes a
  # character, so this is ~1,600 Thai characters. See docs/adr/0012.
  TTS_MAX_REQUEST_BYTES: "5000"
  # Silence left at a join after trimming, in seconds. Ported from
  # shorts-factory, where it was measured against natural breath pauses.
  JOIN_SILENCE: "0.30"

  # --- Render ----------------------------------------------------------------
  # veryfast/crf20 measured 2026-09-14 at 0.61x realtime and 11.9 MB/min: a
  # 40-minute Story is ~25 min wall, ~470 MB, ~400 MB peak RSS. ultrafast is
  # 2.6x faster and 2x the file; it is the escape hatch, not the default.
  RENDER_PRESET: veryfast
  RENDER_CRF: "20"
  # `cpus:` does nothing on DSM (no CFS bandwidth control), so the cap has to be
  # here, on the encoder itself.
  RENDER_THREADS: "3"
  # A Flow clip is played forwards then backwards to loop seamlessly, which
  # holds every frame of the doubled clip in memory: ~3.1 MB/frame at 24fps
  # means 10s already crowds mem_limit: 2g.
  BACKDROP_MAX_SECONDS: "8"

  # --- Editorial -------------------------------------------------------------
  # Religion is excluded from the first ten Stories by a code-level gate, not by
  # a line in the prompt. See docs/adr/0011.
  RELIGION_GATE_UNTIL_STORIES: "10"
  CHAPTERS_PER_STORY: "7"
  WORDS_PER_CHAPTER: "700"
