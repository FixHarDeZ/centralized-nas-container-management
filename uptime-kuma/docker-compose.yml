version: '3.8'

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      # อ้างอิงตาม Path ในรูปภาพของคุณ
      - ${NAS_VOLUME_ROOT}/docker/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "998"  # docker group on Synology
    environment:
      - UPTIME_KUMA_IS_CONTAINER=1
      - TZ=Asia/Bangkok
    # ข้อมูลอื่นๆ เช่น PATH, NODE_VERSION ปกติจะติดมากับ Image อยู่แล้ว 
    # ไม่จำเป็นต้องใส่ซ้ำในนี้ครับ